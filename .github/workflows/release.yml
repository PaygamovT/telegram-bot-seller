name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: telegram-bot-seller-windows-x64.exe
            use_cross: false

          # macOS Apple Silicon (ARM64)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: telegram-bot-seller-macos-arm64
            use_cross: false

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: telegram-bot-seller-macos-intel
            use_cross: false

          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: telegram-bot-seller-linux-x64
            use_cross: false

          # Linux ARM64 (aarch64/Arch64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: telegram-bot-seller-linux-arm64
            use_cross: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Install Linux cross-compilation toolchain for ARM64 (AArch64)
      - name: Install ARM64 GCC Cross-Compiler (Ubuntu only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compile Release Binary
        shell: bash
        env:
          # Wire cross-compilation environment variables for Linux ARM64
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: |
          cargo build --target ${{ matrix.target }} --release

      - name: Package Binary & Prepare Asset
        shell: bash
        run: |
          # Create binaries upload directory
          mkdir -p build_assets/
          
          # Move and rename the target binary
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.target }}/release/telegram-bot-seller.exe build_assets/${{ matrix.artifact_name }}
          else
            mv target/${{ matrix.target }}/release/telegram-bot-seller build_assets/${{ matrix.artifact_name }}
            chmod +x build_assets/${{ matrix.artifact_name }}
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-binary
          path: build_assets/${{ matrix.artifact_name }}
          retention-days: 1

  create-github-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: x86_64-pc-windows-msvc-binary
          path: release_assets/

      - name: Download macOS ARM64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: aarch64-apple-darwin-binary
          path: release_assets/

      - name: Download macOS Intel Artifacts
        uses: actions/download-artifact@v4
        with:
          name: x86_64-apple-darwin-binary
          path: release_assets/

      - name: Download Linux x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu-binary
          path: release_assets/

      - name: Download Linux ARM64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: aarch64-unknown-linux-gnu-binary
          path: release_assets/

      - name: Generate MD5 & SHA256 Checksums
        shell: bash
        run: |
          cd release_assets/
          echo "### Checksums (SHA256 & MD5)" > checksums.txt
          echo '```' >> checksums.txt
          sha256sum * >> checksums.txt
          echo '```' >> checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/telegram-bot-seller-windows-x64.exe
            release_assets/telegram-bot-seller-macos-arm64
            release_assets/telegram-bot-seller-macos-intel
            release_assets/telegram-bot-seller-linux-x64
            release_assets/telegram-bot-seller-linux-arm64
          body: |
            ## 🔮 Autonomous AI Perfume Bot Seller & Admin Web Panel
            
            This automated release delivers size-optimized, stripped, high-performance binaries compiled for multiple platforms:
            
            * **Windows x64**: `.exe` executable for standard Windows environments.
            * **macOS Apple Silicon (ARM64)**: Native executable optimized for M1/M2/M3 Macs.
            * **macOS Intel (x64)**: Native executable for Intel Macs.
            * **Linux x64**: Lightweight static-link binary for Linux x86_64 systems.
            * **Linux ARM64 (Arch64 / AArch64)**: Stripped native binary optimized for smartphone chroots (Samsung Galaxy Flip 3, Termux, Debian deploy) or Raspberry Pi hosts.
            
            ### 🛠️ Key Architectural Inclusions
            * **Shared Core & Migrations**: Embedded SQLite migrations and fully operational connections via pooled SQLite.
            * **Admin Dashboard & WebSocket Console**: Embedded Askama templates for dashboards, dynamic Flip 3 hardware monitoring charts, settings, and live websocket log viewing.
            * **Production Hardening Controls**: Local sliding-window rate limiters, size constraints (<15 MB), database backups via atomic `VACUUM INTO`.
            
            ### 📦 SHA-256 Checksums
            Ensure integrity by verifying checksum hashes:
            
            ```bash
            # On Linux/macOS:
            sha256sum -c checksums.txt
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
